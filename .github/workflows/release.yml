# Desktop installers for Linux, Windows and macOS: build, smoke-test, and on a version tag publish a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0     # the tag must match desktop/package.json "version"
#
# Release assets keep the same names in every version, so the website links to
# https://github.com/<owner>/<repo>/releases/latest/download/<name> (names in the "release" job below).
# Tags containing "-ci." (v0.0.1-ci.1) and manual runs (workflow_dispatch) do everything except create the release.
name: Release

on:
  push:
    tags: ['v*']
    branches: [ci-setup] # TEMPORARY: while setting up CI; removed before merging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # The collaborative-filtering model (scripts/build-cf.py, docs/adr/0002). data/ isn't in git, so it is built
  # here once per change of the build script and shared with every OS as an artifact.
  cf-model:
    name: CF model
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the app version
        id: tag
        run: |
          version=$(jq -r .version desktop/package.json)
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              *-ci.*) echo "::notice title=Rehearsal::$GITHUB_REF_NAME is a CI rehearsal tag: everything runs except creating the release." ;;
              "v$version") publish=true ;;
              *) echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME doesn't match desktop/package.json version $version. Set the version, commit, and tag v$version."; exit 1 ;;
            esac
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "app version $version, publish: $publish"

      - name: Restore the model
        id: model
        uses: actions/cache@v6
        with:
          path: cf-model/cf.bin
          key: cf-model-${{ hashFiles('scripts/build-cf.py') }}

      - name: Restore the MovieLens 32M download
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: cf-model/raw/ml-32m.zip
          key: movielens-32m-d472be332d4daa821edc399621853b57

      # Ubuntu's own packages, as on the laptop the model was developed on. OpenBLAS (multithreaded) instead of the
      # reference BLAS/LAPACK they otherwise pull in: the model's dense 18,797² inverse needs it.
      - name: Install numpy, scipy, pandas and OpenBLAS
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-numpy python3-scipy python3-pandas libopenblas0-pthread unzip
          /usr/bin/python3 -I -c "import numpy, scipy, pandas; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'pandas', pandas.__version__)"
          update-alternatives --display liblapack.so.3-x86_64-linux-gnu | head -3

      - name: Build the model (MovieLens 32M, EDLAE; about 5 GB of RAM)
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          free -g
          .github/scripts/run-logged.sh "CF model build" /usr/bin/python3 -I scripts/build-cf.py build --data cf-model

      - name: Check the model
        run: |
          size=$(stat -c %s cf-model/cf.bin)
          echo "cf.bin: $size bytes"
          [ "$size" -gt 10000000 ] || { echo "::error title=CF model::cf.bin is only $size bytes"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: cf-model
          path: cf-model/cf.bin
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }}
    needs: cf-model
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            dist: --linux --x64
            assets: nexttupp-linux-x86_64.AppImage nexttupp-linux-amd64.deb
          - name: Windows x64
            os: windows-2025
            dist: --win --x64
            assets: nexttupp-windows-x64.exe
          - name: macOS arm64
            os: macos-15
            dist: --mac --arm64
            arch: arm64
            assets: nexttupp-mac-arm64.dmg
          - name: macOS x64
            os: macos-15-intel
            dist: --mac --x64
            arch: x86_64
            assets: nexttupp-mac-x64.dmg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # The server is bundled by esbuild with its native extras stubbed out (docs/adr/0005), so the root packages'
      # install scripts (node-datachannel and friends) aren't needed.
      - name: Install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop

      - name: Restore the Electron runtime and electron-builder tools
        uses: actions/cache@v6
        with:
          path: desktop/vendor/cache
          key: desktop-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/package-lock.json') }}

      - name: Restore the ffmpeg downloads
        uses: actions/cache@v6
        with:
          path: desktop/vendor/downloads
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/fetch-ffmpeg.mjs') }}

      - uses: actions/download-artifact@v8
        with:
          name: cf-model
          path: desktop/vendor/cf-model

      - name: Fetch ffmpeg (pinned, SHA-256 verified)
        working-directory: desktop
        run: bash ../.github/scripts/run-logged.sh "fetch ffmpeg" node scripts/fetch-ffmpeg.mjs

      - name: Build the app
        working-directory: desktop
        env:
          CF_BIN: vendor/cf-model/cf.bin
        run: bash ../.github/scripts/run-logged.sh "build" node scripts/build.mjs

      - name: Package
        working-directory: desktop
        run: bash ../.github/scripts/run-logged.sh "package" node scripts/dist.mjs ${{ matrix.dist }}

      - name: Collect the installers
        run: |
          mkdir -p out
          for f in ${{ matrix.assets }}; do
            [ -s "desktop/release/$f" ] || { echo "::error title=Missing installer::$f was not produced; desktop/release has: $(ls desktop/release | tr '\n' ' ')"; exit 1; }
            mv "desktop/release/$f" out/
          done
          ls -l out

      - name: Smoke test (AppImage and .deb)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/out/nexttupp-linux-x86_64.AppImage" --appimage-extract >/dev/null)
          xvfb-run -a node scripts/smoke.mjs "$RUNNER_TEMP/squashfs-root" --app --expect-cf
          dpkg-deb -x ../out/nexttupp-linux-amd64.deb "$RUNNER_TEMP/deb"
          node scripts/smoke.mjs "$RUNNER_TEMP/deb/opt/nexttupp" --expect-cf

      - name: Smoke test (installer)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ..\out\nexttupp-windows-x64.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "::error title=Installer::nexttupp-windows-x64.exe /S exited with $($p.ExitCode)"; exit 1 }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\nexttupp'
          if (-not (Test-Path (Join-Path $dir 'nexttupp.exe'))) {
            $found = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter nexttupp.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join ', '
            Write-Output "::error title=Installer::nexttupp.exe is not in $dir (found: $found)"
            exit 1
          }
          node scripts/smoke.mjs $dir --app --expect-cf
          exit $LASTEXITCODE

      - name: Smoke test (dmg)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "../out/${{ matrix.assets }}"
          app="$mnt/nexttupp.app"
          codesign -dv "$app" 2>&1 | grep -E '^(Identifier|Format|Signature|TeamIdentifier)=' || true
          bash ../.github/scripts/run-logged.sh "codesign --verify" codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app/Contents/MacOS/nexttupp" "$app/Contents/Resources/ffmpeg/bin/ffmpeg" "$app/Contents/Resources/ffmpeg/bin/ffprobe"; do
            archs=$(lipo -archs "$bin")
            [ "$archs" = "${{ matrix.arch }}" ] || { echo "::error title=Architecture::$bin is $archs, expected ${{ matrix.arch }}"; exit 1; }
          done
          node scripts/smoke.mjs "$app" --app --expect-cf
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Release
    needs: [cf-model, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: out
          merge-multiple: true

      - name: Check the assets
        working-directory: out
        run: |
          for f in nexttupp-linux-x86_64.AppImage nexttupp-linux-amd64.deb nexttupp-windows-x64.exe nexttupp-mac-arm64.dmg nexttupp-mac-x64.dmg; do
            [ -s "$f" ] || { echo "::error title=Missing asset::$f"; exit 1; }
          done
          sha256sum nexttupp-* > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          nexttupp runs on your own computer: search, torrents and playback all happen there.

          | Your computer | Download |
          |---|---|
          | Windows 10 or 11 | [nexttupp-windows-x64.exe](https://github.com/${{ github.repository }}/releases/latest/download/nexttupp-windows-x64.exe) |
          | Mac with Apple silicon (M1 or later) | [nexttupp-mac-arm64.dmg](https://github.com/${{ github.repository }}/releases/latest/download/nexttupp-mac-arm64.dmg) |
          | Mac with an Intel processor | [nexttupp-mac-x64.dmg](https://github.com/${{ github.repository }}/releases/latest/download/nexttupp-mac-x64.dmg) |
          | Linux (any distribution) | [nexttupp-linux-x86_64.AppImage](https://github.com/${{ github.repository }}/releases/latest/download/nexttupp-linux-x86_64.AppImage) |
          | Debian, Ubuntu | [nexttupp-linux-amd64.deb](https://github.com/${{ github.repository }}/releases/latest/download/nexttupp-linux-amd64.deb) |

          The installers aren't signed with a paid certificate, so the first launch takes one extra step:

          - **Windows:** if SmartScreen says "Windows protected your PC", click **More info**, then **Run anyway**.
          - **macOS:** open the .dmg and drag nexttupp to Applications. The first time, right-click (or Control-click) nexttupp in Applications and choose **Open**, then **Open** again. On macOS 15 (Sequoia) and later: open it once, then go to System Settings → Privacy & Security and click **Open Anyway**.
          - **Linux AppImage:** make it executable (`chmod +x nexttupp-linux-x86_64.AppImage`) and run it.

          SHA-256 checksums are in SHA256SUMS.txt.
          EOF
          cat notes.md

      - name: Publish the release
        if: needs.cf-model.outputs.publish == 'true'
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "nexttupp ${TAG#v}" --notes-file notes.md --latest --verify-tag
          fi
          echo "::notice title=Released::https://github.com/$GH_REPO/releases/tag/$TAG"

      - name: Rehearse (no release)
        if: needs.cf-model.outputs.publish != 'true'
        run: |
          gh release list --limit 5
          echo "::notice title=Not published::$TAG ($GITHUB_REF_TYPE): all five installers built, tested and checked; the release step was skipped. A tag v<version> matching desktop/package.json publishes."
