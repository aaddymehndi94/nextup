# Typecheck and unit tests on every push to main and every pull request. About a minute.
name: CI

on:
  push:
    branches: [main, ci-setup] # TEMPORARY: ci-setup only while setting up CI
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix desktop

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck --prefix desktop

      - name: Unit tests
        run: npm test
