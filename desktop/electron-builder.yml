# Installers: npm run dist:linux (AppImage + deb), npm run dist:win (NSIS), npm run dist:mac (dmg, this Mac's arch).
# All of them are built and smoke-tested by .github/workflows/release.yml, which publishes tags as GitHub Releases.
appId: app.nexttupp.desktop
productName: nexttupp
executableName: nexttupp
copyright: nexttupp
# Package the Electron runtime that npm install already fetched and checksum-verified (no second download).
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: resources
# The app is a handful of files (main.cjs, server.mjs, the web build), so no asar: the server is an ES
# module run in a utility process and serves the web files with plain fs calls.
asar: false
files:
  - build/**/*
  - package.json
extraResources:
  # Pinned, checksum-verified ffmpeg/ffprobe from scripts/fetch-ffmpeg.mjs.
  - from: vendor/ffmpeg/${platform}-${arch}
    to: ffmpeg
  # Collaborative-filtering model, when the build staged one (CF_BIN=… npm run build).
  - from: vendor/reco
    to: reco
    filter: [cf.bin]
publish: null
artifactName: ${productName}-${version}-${arch}.${ext}
# Release assets keep the same names in every version, so the website can link to
# https://github.com/<owner>/<repo>/releases/latest/download/<name>.
linux:
  target: [AppImage, deb]
  category: AudioVideo
  icon: resources/icon.png
  synopsis: Search, pick a torrent, watch.
  maintainer: nexttupp
appImage:
  artifactName: nexttupp-linux-${arch}.${ext}
deb:
  artifactName: nexttupp-linux-${arch}.${ext}
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: nexttupp-windows-${arch}.${ext}
mac:
  target: dmg
  icon: resources/icon.png
  category: public.app-category.entertainment
  # No Apple Developer ID, so an ad-hoc signature ("-"): Apple Silicon refuses to run unsigned code at all. Friends
  # open it the first time with right-click → Open (macOS 15+: System Settings → Privacy & Security → Open Anyway).
  # The hardened runtime only matters for notarization, and with an ad-hoc signature it would reject Electron's
  # own frameworks (library validation), so it stays off.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  artifactName: nexttupp-mac-${arch}.${ext}
